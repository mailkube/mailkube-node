# Run `pre-commit install && pre-commit install --hook-type commit-msg` after `npm install`.
# The Node hooks call the locally-installed eslint/prettier; jscpd is fetched via npx.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: prettier
        name: prettier (format)
        entry: npx prettier --write
        language: system
        types_or: [ts, javascript, json, yaml, markdown]
      # `types_or`, not `types: [ts]` — the examples are `.mjs`, and a TypeScript-only matcher
      # meant this hook never fired for them even though eslint now covers the directory.
      - id: eslint
        name: eslint
        entry: npx eslint --fix
        language: system
        types_or: [ts, javascript]
        pass_filenames: false
      - id: examples-parse
        name: examples parse (node --check)
        entry: node --check
        language: system
        files: ^examples/.*\.mjs$

  # Language-agnostic DRY gate — identical config in every mailkube repo.
  - repo: local
    hooks:
      - id: jscpd
        name: jscpd (copy-paste detector)
        entry: npx --yes jscpd@4 --config .jscpd.json .
        language: system
        pass_filenames: false
      - id: jscpd-examples
        name: jscpd (examples, higher threshold)
        entry: npx --yes jscpd@4 --config .jscpd.examples.json examples/
        language: system
        pass_filenames: false

  # Enforce Conventional Commits on the commit message (matches the org house style).
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.22.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"
