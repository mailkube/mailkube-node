name: PR Title

# Enforce Conventional Commits on the PR title, since PRs are squash-merged using it.
# Only `feat:`, `fix:`, and `perf:` trigger a release on `main`.
# NOTE: rendered verbatim (see `_copy_without_render` in cookiecutter.json) so GitHub Actions
# `${{ ... }}` expressions are not mangled by Cookiecutter's Jinja pass.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    # The branch-protection ruleset requires a check called `PR-title`, and GitHub names a check
    # after the JOB, not the workflow. Without this the check is reported as `conventional-title`
    # and a ruleset requiring `PR-title` waits for a check that never arrives, blocking every PR.
    name: PR-title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
